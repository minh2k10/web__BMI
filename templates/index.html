<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINH đoán ngoại hình của bạn</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: #ffffff; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 100%; max-width: 480px; }
        h1 { color: #333; text-align: center; margin-bottom: 20px; font-size: 22px; font-weight: 700; }
        
        .info-box { background: #f8f9fa; padding: 15px; border-left: 4px solid #667eea; border-radius: 6px; margin-bottom: 20px; font-size: 14px; color: #555; }
        .info-box h4 { margin-bottom: 6px; font-weight: 600; color: #333; }
        .info-box p { margin: 3px 0; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; color: #444; font-size: 14px; }
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; transition: border-color 0.3s; }
        input:focus { border-color: #667eea; outline: none; box-shadow: 0 0 5px rgba(102, 126, 234, 0.4); }
        
        button { width: 100%; padding: 14px; background: #667eea; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s, transform 0.1s; margin-top: 10px; }
        button:hover { background: #5a67d8; }
        button:active { transform: scale(0.98); }
        
        /* Phần hiển thị kết quả */
        .result-box { margin-top: 25px; padding: 16px; background: #eef2ff; border-radius: 10px; border: 1px solid #c7d2fe; text-align: center; }
        .result-box h2 { color: #3730a3; font-size: 17px; margin: 6px 0; font-weight: 600; line-height: 1.4; }
    </style>
</head>
<body>
    <div class="card">
        <h1>MINH đoán ngoại hình của bạn</h1>

        <div class="info-box">
            <h4>Mốc đánh giá BMI:</h4>
            <p>• BMI nhỏ hơn 18,5 (Thiếu cân)</p>
            <p>• BMI trong khoảng 18,5 - 22,9 (Cân đối)</p>
            <p>• BMI lớn hơn 22,9 (Thừa cân)</p>
        </div>

        <form method="POST" id="bmiForm">
            <div class="form-group">
                <label for="name">Họ và tên:</label>
                <input type="text" id="name" name="name" placeholder="Nhập tên của bạn" required>
            </div>
            
            <div class="form-group">
                <label for="weight">Cân nặng (kg):</label>
                <input type="number" step="0.1" id="weight" name="weight" placeholder="Khối lượng của bạn (kg)" required>
            </div>

            <div class="form-group">
                <label for="height">Chiều cao (cm):</label>
                <input type="number" step="0.1" id="height" name="height" placeholder="Chiều cao của bạn (cm)" required>
            </div>

            <button type="submit" id="submitBtn">Tôi đồng tính, dự đoán</button>
        </form>

        <!-- Hiển thị kết quả trả về từ Flask -->
        {% if BODY_result %}
        <div class="result-box" id="resultContainer">
            <h2>{{ BODY_result }}</h2>
            <h2>{{ BMI_result }}</h2>
        </div>
        {% endif %}
    </div>

    <!-- Tải tệp mã JavaScript -->
    <script src="/static/script.js"></script>
</body>
</html>
